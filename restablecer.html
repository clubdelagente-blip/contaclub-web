<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña — ContaClub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://elclubdelagente.com/styles.css?v=143">
  <link rel="stylesheet" href="app.css?v=8">
</head>
<body>
  <div class="cc-wrap">
    <a href="index.html" class="cc-brand" style="text-decoration:none">Conta<span>Club</span></a>
    <div class="cc-card">
      <h1>Crea tu nueva contraseña</h1>
      <p class="cc-sub">Escribe la contraseña que vas a usar de ahora en adelante.</p>
      <p class="cc-error" id="res-error" hidden></p>
      <form id="res-form">
        <div class="cc-campo"><label>Nueva contraseña *</label><input id="res-pass" type="password" minlength="6" required></div>
        <button type="submit" class="btn btn--primario" id="res-btn" style="width:100%;justify-content:center;margin-top:4px">Guardar contraseña</button>
      </form>
    </div>
  </div>
  <script type="module" src="restablecer.js"></script>
</body>
</html>
