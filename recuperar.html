<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña — ContaClub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://elclubdelagente.com/styles.css?v=143">
  <link rel="stylesheet" href="app.css?v=6">
</head>
<body>
  <div class="cc-wrap">
    <a href="index.html" class="cc-brand" style="text-decoration:none">Conta<span>Club</span></a>
    <div class="cc-card">
      <div id="rec-wrap">
        <h1>Recupera tu contraseña</h1>
        <p class="cc-sub">Te mandamos un link para crear una nueva.</p>
        <p class="cc-error" id="rec-error" hidden></p>
        <form id="rec-form">
          <div class="cc-campo"><label>Correo</label><input id="rec-email" type="email" required></div>
          <button type="submit" class="btn btn--primario" id="rec-btn" style="width:100%;justify-content:center;margin-top:4px">Enviar link</button>
        </form>
        <div class="cc-switch"><a href="login.html">Volver a iniciar sesión</a></div>
      </div>
      <div class="cc-exito" id="rec-exito" hidden>
        <div class="cc-exito__check">✓</div>
        <h1 style="text-align:center">Revisa tu correo</h1>
        <p>Si ese correo tiene una cuenta, te llegó un link para crear una contraseña nueva.</p>
      </div>
    </div>
  </div>
  <script type="module" src="recuperar.js"></script>
</body>
</html>
